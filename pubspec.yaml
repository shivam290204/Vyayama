name: fitbuddy
description: Vyayama - Every effort counts. A companion that celebrates your consistency.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State and navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Backend and config
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1

  # UI and animation
  google_fonts: ^6.2.1
  rive: ^0.13.20
  lottie: ^3.2.0

  # Local storage
  shared_preferences: ^2.3.3

  # Health, reminders, push
  health: ^11.1.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # Camera and photos
  camera: ^0.11.0+2
  flutter_image_compress: ^2.3.0
  permission_handler: ^11.3.1
  google_mlkit_image_labeling: ^0.14.0

  # Friends: QR, invites, deep links
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.2
  app_links: ^6.3.3

  # Models (optional codegen)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/
    - assets/rive/
    - assets/lottie/
    - assets/images/
    - assets/audio/
