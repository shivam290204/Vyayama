name: fitbuddy
description: Vyayama - Every effort counts. A companion that celebrates your consistency.
publish_to: "none"
version: 0.1.0+7

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter:
    sdk: flutter

  # State and navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Backend and config
  supabase_flutter: ^2.18.0
  flutter_dotenv: ^5.2.1

  # UI and animation
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lottie: ^3.2.0

  # Local storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Health, reminders, push
  health: 13.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  workmanager: ^0.10.10
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # Camera and photos
  camera: ^0.11.0+2
  flutter_image_compress: ^2.3.0
  permission_handler: ^11.3.1
  google_mlkit_image_labeling: ^0.14.0

  # Friends: QR, invites, deep links
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.2
  app_links: ^6.3.3
  path_provider: ^2.1.5

  # Models (optional codegen)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  audioplayers: ^6.8.1
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.3
  pedometer: ^4.2.0
  flutter_timezone: ^5.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/data/
    - assets/lottie/
    - assets/images/
    - assets/images/mascot/
    - assets/audio/
    - assets/exercises/
